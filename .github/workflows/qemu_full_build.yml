name: Build Component in Native Environment

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main, qemu, 'sprint/**', 'release/**', develop, 'test/**' ]
  pull_request:
    branches: [ main, qemu, 'sprint/**', 'release/**', topic/RDK*, develop, 'test/**' ]

jobs:
  build-and-deploy-to-qemu:
    name: Build entservices-hdmicecsource and deploy into QEMU
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rdkcentral/docker-rdk-ci:latest
    defaults:
      run:
        shell: bash
    env:
      QEMU_WORKDIR: /tmp/qemu-artifacts
      SSH_HOST_PORT: '5522'
      SSH_HOST_PORT_ALT: '5523'
      WPEFRAMEWORK_HOST_PORT: '59998'
      VCOMPONENT_HOST_PORT: '58080'
      QEMU_SSH_USER: root
      QEMU_GUEST_LIB_DIR: /usr/lib/wpeframework/plugins
      SKIP_COMPONENT_BUILD: 'true'
      GITHUB_IMAGE_ASSET_NAME: DefaultImage.tar.gz
      QEMU_RUN_SCRIPT_FILE: run_qemu.sh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build dependencies
        if: ${{ env.SKIP_COMPONENT_BUILD != 'true' }}
        run: |
          sh -x build_dependencies.sh

      - name: Build entservices-hdmicecsource
        if: ${{ env.SKIP_COMPONENT_BUILD != 'true' }}
        run: |
          sh -x cov_build.sh

      - name: Collect plugin artifacts
        if: ${{ env.SKIP_COMPONENT_BUILD != 'true' }}
        run: |
          set -euo pipefail

          echo "===== plugin source commit metadata ====="
          git -C "$GITHUB_WORKSPACE" log -1 --pretty='format:commit=%H%nshort=%h%nauthor=%an%ndate=%cI%nsubject=%s' | tee "$QEMU_WORKDIR/plugin-source-commit.txt"

          mkdir -p artifacts/plugins
          find "$PWD/install" -type f -name '*.so' | grep '/plugins/' | tee artifacts/plugins/so-list.txt
          while IFS= read -r sofile; do
            cp -v "$sofile" artifacts/plugins/
          done < artifacts/plugins/so-list.txt
          test -n "$(ls -A artifacts/plugins/*.so 2>/dev/null || true)" || {
            echo "No plugin .so files found under install path" >&2
            exit 1
          }

          {
            echo "===== local plugin artifact manifest ====="
            for sofile in artifacts/plugins/*.so; do
              echo "--- $(basename "$sofile") ---"
              ls -lh "$sofile"
              sha256sum "$sofile"
              if command -v readelf >/dev/null 2>&1; then
                readelf -n "$sofile" 2>/dev/null | grep -E "Build ID" || true
              fi
            done
          } | tee "$QEMU_WORKDIR/plugin-artifact-manifest.txt"

      - name: Install QEMU and SSH tools
        run: |
          set -euo pipefail

          # Report what is already present so we can skip unnecessary installs.
          already_ok=true
          for cmd in qemu-system-x86_64 ssh curl jq nc git-lfs; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              already_ok=false
              echo "Missing: $cmd"
            else
              echo "Already available: $cmd ($(command -v "$cmd"))"
            fi
          done

          if [[ "$already_ok" == "true" ]]; then
            echo "All required tools already present in container image. Skipping apt-get."
            exit 0
          fi

          # Retry apt-get update up to 3 times to handle transient mirror failures.
          for attempt in 1 2 3; do
            apt-get update && break || {
              echo "apt-get update failed (attempt $attempt/3), retrying in 10s..."
              sleep 10
            }
          done

          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --fix-missing \
            qemu-system-x86 \
            openssh-client \
            curl \
            jq \
            ca-certificates \
            netcat-openbsd \
            git-lfs || {
            echo "apt-get install failed. Checking if critical tools are available anyway..."
            command -v qemu-system-x86_64 || { echo "qemu-system-x86_64 is not available" >&2; exit 1; }
          }

      - name: Pull Git LFS assets for QEMU images
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --git-dir
          git lfs version
          git lfs install --local
          git lfs pull --include="Tests/vDeviceTests/qemu-images/*"
          ls -lh "$GITHUB_WORKSPACE/Tests/vDeviceTests/qemu-images/" || true

      - name: Download and prepare kernel/rootfs from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$QEMU_WORKDIR"

          image_tar="$QEMU_WORKDIR/DefaultImage.tar.gz"
          extract_dir="$QEMU_WORKDIR/image"
          releases_api="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest"
          repo_image_tar="$GITHUB_WORKSPACE/Tests/vDeviceTests/qemu-images/DefaultImage.tar.gz"

          # Prefer repository-local image tar when present in checkout.
          if [[ -f "$repo_image_tar" ]]; then
            echo "Using repository-local image tar: $repo_image_tar"
            cp -f "$repo_image_tar" "$image_tar"
          else
            if [[ -z "${GH_TOKEN:-}" ]]; then
              echo "ERROR: github.token is not available for release asset download" >&2
              exit 1
            fi

            echo "Resolving release asset from latest GitHub release..."
            release_json="$(curl -sS -fL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$releases_api")"

            asset_id="$(echo "$release_json" | jq -r --arg name "$GITHUB_IMAGE_ASSET_NAME" '.assets[] | select(.name == $name) | .id' | head -n 1)"
            if [[ -z "$asset_id" || "$asset_id" == "null" ]]; then
              echo "ERROR: Asset '$GITHUB_IMAGE_ASSET_NAME' not found in latest release" >&2
              echo "Available assets in latest release:" >&2
              echo "$release_json" | jq -r '.assets[]?.name' | sed 's/^/  - /' >&2
              exit 1
            fi

            echo "Downloading release asset id $asset_id ($GITHUB_IMAGE_ASSET_NAME)..."
            curl -sS -fL \
              --retry 3 \
              --retry-delay 5 \
              --connect-timeout 15 \
              --max-time 600 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              -w 'GET HTTP:%{http_code} SIZE:%{size_download} TOTAL:%{time_total}s\n' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              -o "$image_tar"
          fi

          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"

          # Detect accidental Git LFS pointer checkout before extraction.
          if head -n 1 "$image_tar" | grep -q 'version https://git-lfs.github.com/spec/v1'; then
            echo "ERROR: $image_tar is a Git LFS pointer, not the real artifact." >&2
            echo "Ensure git-lfs is installed and LFS objects are pulled in the workflow." >&2
            exit 1
          fi

          # Support both gzip-compressed tar and plain tar payloads.
          if tar -tzf "$image_tar" >/dev/null 2>&1; then
            tar -xzf "$image_tar" -C "$extract_dir"
          else
            tar -xf "$image_tar" -C "$extract_dir"
          fi

          echo "Extracted tar contents:"
          find "$extract_dir" -type f | xargs ls -lh

          kernel_src="$(find "$extract_dir" -type f \( -name 'bzImage*' -o -name 'vmlinuz*' -o -name '*.bin' \) | head -n 1 || true)"
          rootfs_src="$(find "$extract_dir" -type f \( -name '*.rootfs.ext4' -o -name 'rootfs.ext4' -o -name '*.ext4' \) | head -n 1 || true)"

          [[ -n "$kernel_src" && -f "$kernel_src" ]] || {
            echo "Kernel image not found in extracted artifact" >&2
            find "$extract_dir" -maxdepth 4 -type f | sed 's/^/  - /' >&2 || true
            exit 1
          }
          [[ -n "$rootfs_src" && -f "$rootfs_src" ]] || {
            echo "Rootfs image not found in extracted artifact" >&2
            find "$extract_dir" -maxdepth 4 -type f | sed 's/^/  - /' >&2 || true
            exit 1
          }

          echo "Selected kernel source: $kernel_src"
          echo "Selected rootfs source: $rootfs_src"
          ls -lh "$kernel_src" "$rootfs_src"

          cp -f "$kernel_src" "$QEMU_WORKDIR/kernel.bin"
          cp -f "$rootfs_src" "$QEMU_WORKDIR/rootfs.ext4"
          
          # Ensure files are readable by QEMU process
          chmod 644 "$QEMU_WORKDIR/kernel.bin" "$QEMU_WORKDIR/rootfs.ext4"

          echo "Prepared runtime images in $QEMU_WORKDIR"
          ls -lh "$QEMU_WORKDIR/kernel.bin" "$QEMU_WORKDIR/rootfs.ext4"
          
          # Verify rootfs.ext4 is a valid ext4 filesystem (not truncated/corrupted)
          echo "Verifying rootfs.ext4 integrity..."
          file "$QEMU_WORKDIR/rootfs.ext4"
          if ! file "$QEMU_WORKDIR/rootfs.ext4" | grep -qi 'ext4.*filesystem'; then
            echo "ERROR: rootfs.ext4 is not a valid ext4 filesystem. File may be truncated or corrupted." >&2
            echo "Expected: ext4 filesystem (at least 500M)" >&2
            exit 1
          fi
          
          # Compute checksums for debugging
          sha256sum "$QEMU_WORKDIR/kernel.bin" "$QEMU_WORKDIR/rootfs.ext4" || true

          run_script_src="$GITHUB_WORKSPACE/Tests/vDeviceTests/qemu-images/$QEMU_RUN_SCRIPT_FILE"
          if [[ -f "$run_script_src" ]]; then
            cp -f "$run_script_src" "$QEMU_WORKDIR/run_qemu.sh"
            chmod +x "$QEMU_WORKDIR/run_qemu.sh"
          fi

          ls -lh "$QEMU_WORKDIR/"

      - name: Boot QEMU inside CI container
        run: |
          set -euo pipefail

          echo "qemu-system-x86_64 version:"
          qemu-system-x86_64 --version | head -n 1

          # Use KVM if available for fast boot; fall back to TCG (slow ~5-10 min)
          # TCG uses IvyBridge to match the validated run_qemu.sh CPU model
          if [[ -r /dev/kvm ]]; then
            accel_args="-machine q35,accel=kvm -enable-kvm -cpu host"
            echo "KVM available, using hardware acceleration"
          else
            accel_args="-machine q35,accel=tcg -cpu IvyBridge"
            echo "KVM not available, using software emulation with IvyBridge CPU (boot may take 5-10 minutes)"
          fi

          echo "Launching QEMU with SSH forward host 127.0.0.1:${SSH_HOST_PORT} -> guest:22"

          # Final check: rootfs must be readable
          if [[ ! -r "$QEMU_WORKDIR/rootfs.ext4" ]]; then
            echo "ERROR: rootfs.ext4 is not readable" >&2
            stat "$QEMU_WORKDIR/rootfs.ext4"
            exit 1
          fi
          
          qemu-system-x86_64 \
            $accel_args \
            -kernel "$QEMU_WORKDIR/kernel.bin" \
            -append "console=ttyS0 earlyprintk=serial,ttyS0 loglevel=7 root=/dev/vda rw rootwait rootdelay=10 rootfstype=ext4 init=/sbin/init" \
            -drive file="$QEMU_WORKDIR/rootfs.ext4",if=virtio,format=raw \
            -smp 4 \
            -m 2048 \
            -display none \
            -serial file:"$QEMU_WORKDIR/serial.log" \
            -netdev user,id=network0,hostfwd=tcp:127.0.0.1:${SSH_HOST_PORT}-:22,hostfwd=tcp:127.0.0.1:${WPEFRAMEWORK_HOST_PORT}-127.0.0.1:9998,hostfwd=tcp:127.0.0.1:${VCOMPONENT_HOST_PORT}-127.0.0.1:8080 \
            -device virtio-net-pci,netdev=network0 \
            -daemonize \
            -pidfile "$QEMU_WORKDIR/qemu.pid"

          echo "QEMU started with PID: $(cat $QEMU_WORKDIR/qemu.pid)"
          if ! kill -0 "$(cat "$QEMU_WORKDIR/qemu.pid")" 2>/dev/null; then
            echo "QEMU process is not alive immediately after launch" >&2
            echo "Checking serial output for early errors:" >&2
            tail -n 30 "$QEMU_WORKDIR/serial.log" 2>/dev/null || true
            exit 1
          fi
          echo "Initial serial output (checking for early boot errors):"
          sleep 3  # Give QEMU time to start outputting
          tail -n 50 "$QEMU_WORKDIR/serial.log" 2>/dev/null || true

      - name: Wait for SSH in guest
        env:
          QEMU_SSH_PRIVATE_KEY: ${{ secrets.QEMU_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          ssh_key_arg=()
          if [[ -n "${QEMU_SSH_PRIVATE_KEY:-}" ]]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$QEMU_SSH_PRIVATE_KEY" > ~/.ssh/qemu_id_rsa
            chmod 600 ~/.ssh/qemu_id_rsa
            ssh_key_arg=(-i ~/.ssh/qemu_id_rsa)
          fi

          user_candidates=("$QEMU_SSH_USER" "root" "rdk")

          # Allow up to 20 min (240 x 5s); TCG emulation needs ~10 min to boot
          for attempt in $(seq 1 240); do
            # Abort early if QEMU process died
            if [[ -f "$QEMU_WORKDIR/qemu.pid" ]] && ! kill -0 "$(cat "$QEMU_WORKDIR/qemu.pid")" 2>/dev/null; then
              echo "QEMU process exited before SSH became ready" >&2
              break
            fi

            if (( attempt == 1 || attempt % 20 == 0 )); then
              echo "SSH readiness attempt $attempt/240 on port $SSH_HOST_PORT"
            fi

            # Print serial log progress every 30 attempts (~2.5 min)
            if (( attempt % 30 == 0 )); then
              echo "--- boot progress at attempt $attempt ---"
              tail -n 20 "$QEMU_WORKDIR/serial.log" 2>/dev/null || true
            fi

            if nc -z -w2 127.0.0.1 "$SSH_HOST_PORT" 2>/dev/null; then
              echo "TCP port $SSH_HOST_PORT is open; checking SSH login for candidate users"
              for ssh_user in "${user_candidates[@]}"; do
                if ssh "${ssh_key_arg[@]}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -p "$SSH_HOST_PORT" "$ssh_user@127.0.0.1" 'echo SSH_READY' 2>/dev/null; then
                  echo "QEMU_SSH_PORT=$SSH_HOST_PORT" > "$QEMU_WORKDIR/ssh-target.env"
                  echo "QEMU_SSH_USER=$ssh_user" >> "$QEMU_WORKDIR/ssh-target.env"
                  echo "SSH ready as user: $ssh_user"
                  exit 0
                fi
              done
            fi
            sleep 5
          done

          echo "QEMU guest SSH did not become ready in time" >&2
          echo "----- last 100 lines of serial.log -----" >&2
          tail -n 100 "$QEMU_WORKDIR/serial.log" >&2 || true
          exit 1

      - name: Inspect guest block devices and mounts
        env:
          QEMU_SSH_PRIVATE_KEY: ${{ secrets.QEMU_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -f "$QEMU_WORKDIR/ssh-target.env" ]]; then
            # shellcheck disable=SC1090
            source "$QEMU_WORKDIR/ssh-target.env"
          fi

          selected_ssh_port="${QEMU_SSH_PORT:-$SSH_HOST_PORT}"
          selected_ssh_user="${QEMU_SSH_USER:-root}"

          ssh_key_arg=()
          if [[ -n "${QEMU_SSH_PRIVATE_KEY:-}" ]]; then
            ssh_key_arg=(-i ~/.ssh/qemu_id_rsa)
          fi

          ssh "${ssh_key_arg[@]}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$selected_ssh_port" "$selected_ssh_user@127.0.0.1" '
            echo "===== guest uname ====="
            uname -a || true
            echo "===== guest block devices ====="
            lsblk -o NAME,MAJ:MIN,SIZE,TYPE,MOUNTPOINT || true
            echo "===== guest mounts ====="
            mount | head -n 50 || true
            echo "===== root mount source ====="
            cat /proc/mounts | grep " / " || true
          '

      - name: Wait for guest vComponent readiness
        env:
          QEMU_SSH_PRIVATE_KEY: ${{ secrets.QEMU_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -f "$QEMU_WORKDIR/ssh-target.env" ]]; then
            # shellcheck disable=SC1090
            source "$QEMU_WORKDIR/ssh-target.env"
          fi

          selected_ssh_port="${QEMU_SSH_PORT:-$SSH_HOST_PORT}"
          selected_ssh_user="${QEMU_SSH_USER:-root}"

          ssh_key_arg=()
          if [[ -n "${QEMU_SSH_PRIVATE_KEY:-}" ]]; then
            ssh_key_arg=(-i ~/.ssh/qemu_id_rsa)
          fi

          for attempt in $(seq 1 120); do
            if (( attempt == 1 || attempt % 12 == 0 )); then
              echo "vComponent readiness attempt $attempt/120 (port $VCOMPONENT_HOST_PORT)"
            fi

            if nc -z -w2 127.0.0.1 "$VCOMPONENT_HOST_PORT" 2>/dev/null; then
              echo "vComponent port $VCOMPONENT_HOST_PORT is open"
              echo "vComponent is ready — proceeding to tests"
              exit 0
            fi

            sleep 5
          done

          echo "Timed out waiting for vComponent readiness" >&2
          echo "===== host port check =====" >&2
          nc -zv 127.0.0.1 "$VCOMPONENT_HOST_PORT" || true
          jsonrpc_url="http://127.0.0.1:${WPEFRAMEWORK_HOST_PORT}/jsonrpc"
          echo "===== JSON-RPC probe (informational) =====" >&2
          curl -sS \
            --connect-timeout 2 \
            --max-time 6 \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"Controller.1.status"}' \
            "$jsonrpc_url" || true
          ssh "${ssh_key_arg[@]}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$selected_ssh_port" "$selected_ssh_user@127.0.0.1" '
            echo "===== guest listening ports ====="
            if command -v ss >/dev/null 2>&1; then
              ss -ltnp || true
            elif command -v netstat >/dev/null 2>&1; then
              netstat -ltnp || true
            else
              cat /proc/net/tcp6 /proc/net/tcp 2>/dev/null | awk "NR>1 {print \$2}" | while read hex; do
                port=$(printf "%d" 0x${hex##*:})
                echo "  listening port: $port"
              done
            fi
            echo "===== WPEFramework related processes ====="
            ps w | grep -Ei "wpeframework|wpe|thunder" | grep -v grep || true
            echo "===== vComponent related processes ====="
            ps w | grep -Ei "vcomponent|hdmicec" | grep -v grep || true
          ' || true
          exit 1

      - name: Copy new plugin .so into QEMU
        if: ${{ env.SKIP_COMPONENT_BUILD != 'true' }}
        env:
          QEMU_SSH_PRIVATE_KEY: ${{ secrets.QEMU_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -f "$QEMU_WORKDIR/ssh-target.env" ]]; then
            # shellcheck disable=SC1090
            source "$QEMU_WORKDIR/ssh-target.env"
          fi

          selected_ssh_port="${QEMU_SSH_PORT:-$SSH_HOST_PORT}"
          selected_ssh_user="${QEMU_SSH_USER:-root}"

          ssh_key_arg=()
          if [[ -n "${QEMU_SSH_PRIVATE_KEY:-}" ]]; then
            ssh_key_arg=(-i ~/.ssh/qemu_id_rsa)
          fi

          ssh_opts=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR)

          # Capture local checksums so we can prove guest received the exact same binaries.
          declare -A local_sha_by_file
          for sofile in artifacts/plugins/*.so; do
            fname="$(basename "$sofile")"
            lsha="$(sha256sum "$sofile" | awk '{print $1}')"
            local_sha_by_file["$fname"]="$lsha"
            echo "LOCAL_PLUGIN_SHA256 $fname $lsha"
          done | tee "$QEMU_WORKDIR/plugin-local-sha256.txt"

          for sofile in artifacts/plugins/*.so; do
            scp "${ssh_key_arg[@]}" "${ssh_opts[@]}" -P "$selected_ssh_port" "$sofile" "$selected_ssh_user@127.0.0.1:$QEMU_GUEST_LIB_DIR/"
          done

          # Verify guest plugin binaries match host checksums before restarting framework.
          {
            echo "===== guest plugin checksum verification ====="
            for sofile in artifacts/plugins/*.so; do
              fname="$(basename "$sofile")"
              expected_sha="${local_sha_by_file[$fname]}"
              guest_sha="$(ssh "${ssh_key_arg[@]}" "${ssh_opts[@]}" -p "$selected_ssh_port" "$selected_ssh_user@127.0.0.1" "sha256sum '$QEMU_GUEST_LIB_DIR/$fname' 2>/dev/null | awk '{print \\$1}'")"

              if [[ -z "$guest_sha" ]]; then
                echo "Missing guest plugin file: $QEMU_GUEST_LIB_DIR/$fname" >&2
                exit 1
              fi

              echo "GUEST_PLUGIN_SHA256 $fname $guest_sha"

              if [[ "$guest_sha" != "$expected_sha" ]]; then
                echo "Checksum mismatch for $fname (expected $expected_sha, got $guest_sha)" >&2
                exit 1
              fi
            done
          } | tee "$QEMU_WORKDIR/plugin-guest-sha256.txt"

          ssh "${ssh_key_arg[@]}" "${ssh_opts[@]}" -p "$selected_ssh_port" "$selected_ssh_user@127.0.0.1" '
            set -e
            sync
            restarted_service=""
            for svc in wpeframework WPEFramework thunder; do
              if systemctl cat "$svc" >/dev/null 2>&1; then
                systemctl restart "$svc"
                restarted_service="$svc"
                break
              fi
            done

            if [ -z "$restarted_service" ]; then
              echo "No known framework service unit found; continuing without explicit restart"
            else
              echo "Restarted framework service: $restarted_service"
            fi

            # Validate framework API inside guest to avoid host-forward timing issues.
            ready=0
            for attempt in $(seq 1 30); do
              if curl -sS --connect-timeout 2 --max-time 5 \
                -H "Content-Type: application/json" \
                --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"Controller.1.status\"}" \
                "http://127.0.0.1:9998/jsonrpc" >/dev/null 2>&1; then
                ready=1
                break
              fi

              if curl -sS --connect-timeout 2 --max-time 5 \
                -H "Content-Type: application/json" \
                --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"Controller.1.status\"}" \
                "http://127.0.0.1:9998/Service" >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 2
            done

            if [ "$ready" -ne 1 ]; then
              echo "Framework JSON-RPC did not become reachable after plugin deployment" >&2
              exit 1
            fi
          '

          echo "Plugin deployment to guest completed and framework API is reachable"

      - name: Pre-test WPEFramework verification
        if: always()
        env:
          QEMU_SSH_PRIVATE_KEY: ${{ secrets.QEMU_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -f "$QEMU_WORKDIR/ssh-target.env" ]]; then
            # shellcheck disable=SC1090
            source "$QEMU_WORKDIR/ssh-target.env"
          fi

          selected_ssh_port="${QEMU_SSH_PORT:-$SSH_HOST_PORT}"
          selected_ssh_user="${QEMU_SSH_USER:-root}"

          ssh_key_arg=()
          if [[ -n "${QEMU_SSH_PRIVATE_KEY:-}" ]]; then
            ssh_key_arg=(-i ~/.ssh/qemu_id_rsa)
          fi

          ssh "${ssh_key_arg[@]}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$selected_ssh_port" "$selected_ssh_user@127.0.0.1" '
            echo "===== pre-test: wpeframework service state ====="
            systemctl is-active wpeframework WPEFramework 2>/dev/null || true
            systemctl status wpeframework WPEFramework --no-pager 2>/dev/null | head -n 60 || true

            echo "===== pre-test: listening ports ====="
            if command -v ss >/dev/null 2>&1; then
              ss -ltnp | grep -E ":9998|:8080" || true
            elif command -v netstat >/dev/null 2>&1; then
              netstat -ltnp | grep -E ":9998|:8080" || true
            fi

            echo "===== pre-test: recent WPE logs ====="
            journalctl -u wpeframework -u WPEFramework -n 120 --no-pager 2>/dev/null || true

            echo "===== pre-test: guest JSON-RPC probe (/Service) ====="
            curl -sS --connect-timeout 2 --max-time 6 \
              -H "Content-Type: application/json" \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"Controller.1.status\"}" \
              "http://127.0.0.1:9998/Service" || true

            echo "===== pre-test: guest JSON-RPC probe (/jsonrpc) ====="
            curl -sS --connect-timeout 2 --max-time 6 \
              -H "Content-Type: application/json" \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"Controller.1.status\"}" \
              "http://127.0.0.1:9998/jsonrpc" || true

            echo "===== pre-test: HdmiCecSource plugin files ====="
            for pso in /usr/lib/wpeframework/plugins/libWPEFrameworkHdmiCecSource.so \
                       /usr/lib/wpeframework/plugins/libWPEFrameworkHdmiCecSourceImplementation.so; do
              if [ -f "$pso" ]; then
                echo "--- $pso ---"
                ls -lh "$pso"
                sha256sum "$pso"
                file "$pso"
                strings "$pso" 2>/dev/null | grep -E '^(API_VERSION|PLUGIN_VERSION|Version|v[0-9]+\.[0-9]+)' | head -n 10 || true
              else
                echo "MISSING: $pso" >&2
              fi
            done

            echo "===== pre-test: HdmiCecSource plugin dependencies ====="
            if command -v ldd >/dev/null 2>&1; then
              ldd /usr/lib/wpeframework/plugins/libWPEFrameworkHdmiCecSource.so 2>/dev/null || true
              ldd /usr/lib/wpeframework/plugins/libWPEFrameworkHdmiCecSourceImplementation.so 2>/dev/null || true
            else
              echo "ldd not available in guest"
            fi

            echo "===== pre-test: direct local plugin activation ====="
            curl -sS --connect-timeout 2 --max-time 6 \
              -H "Content-Type: application/json" \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"Controller.1.activate\",\"params\":{\"callsign\":\"org.rdk.HdmiCecSource\"}}" \
              "http://127.0.0.1:9998/jsonrpc" || true

            echo "===== pre-test: direct local plugin status ====="
            curl -sS --connect-timeout 2 --max-time 6 \
              -H "Content-Type: application/json" \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"Controller.1.status@org.rdk.HdmiCecSource\"}" \
              "http://127.0.0.1:9998/jsonrpc" || true
          ' > "$QEMU_WORKDIR/pretest-wpeframework-check.log" 2>&1 || true

      - name: Run HDMI CEC vDevice tests
        env:
          QEMU_SSH_PRIVATE_KEY: ${{ secrets.QEMU_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          default_tests_dir="$GITHUB_WORKSPACE/Tests/vDeviceTests"
          tests_dir=""

          # Fallback: fetch tests from repo when they are not present in current checkout.
          if [[ ! -d "$default_tests_dir" ]]; then
            echo "Tests/vDeviceTests not found in workspace. Fetching from main branch..."
            mkdir -p "$GITHUB_WORKSPACE/Tests"
            git clone --depth 1 --single-branch --branch main \
              "https://github.com/rdkcentral/entservices-hdmicecsource.git" \
              "$QEMU_WORKDIR/entservices-hdmicecsource-tests"
            cp -a "$QEMU_WORKDIR/entservices-hdmicecsource-tests/Tests/vDeviceTests" "$GITHUB_WORKSPACE/Tests/"
          fi

          if [[ -n "${VDEVICE_TESTS_DIR:-}" && -d "${VDEVICE_TESTS_DIR}" ]]; then
            tests_dir="$VDEVICE_TESTS_DIR"
          elif [[ -d "$default_tests_dir" ]]; then
            tests_dir="$default_tests_dir"
          fi

          if [[ -z "$tests_dir" ]]; then
            echo "Unable to locate Tests/vDeviceTests directory" >&2
            echo "Checked:" >&2
            echo "  - VDEVICE_TESTS_DIR=${VDEVICE_TESTS_DIR:-<unset>}" >&2
            echo "  - $default_tests_dir" >&2
            exit 1
          fi

          echo "Using vDevice test directory: $tests_dir"
          cd "$tests_dir"

          if [[ -f "$QEMU_WORKDIR/ssh-target.env" ]]; then
            # shellcheck disable=SC1090
            source "$QEMU_WORKDIR/ssh-target.env"
          fi

          selected_ssh_port="${QEMU_SSH_PORT:-$SSH_HOST_PORT}"
          selected_ssh_user="${QEMU_SSH_USER:-root}"

          ssh_key_arg=()
          if [[ -n "${QEMU_SSH_PRIVATE_KEY:-}" ]]; then
            ssh_key_arg=(-i ~/.ssh/qemu_id_rsa)
          fi

          # HdmiCecSource reads RDK_PROFILE from the guest filesystem, not from the host runner.
          ssh "${ssh_key_arg[@]}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$selected_ssh_port" "$selected_ssh_user@127.0.0.1" '
            set -eu
            if [[ -f /etc/device.properties ]]; then
              if grep -q "^RDK_PROFILE=" /etc/device.properties; then
                sed -i "s/^RDK_PROFILE=.*/RDK_PROFILE=STB/" /etc/device.properties
              else
                printf "\nRDK_PROFILE=STB\n" >> /etc/device.properties
              fi
            else
              printf "RDK_PROFILE=STB\n" > /etc/device.properties
            fi
            echo "guest RDK_PROFILE: $(grep '^RDK_PROFILE=' /etc/device.properties || true)"
          '

          # Tunnel guest localhost endpoints to local high ports so test traffic is not dependent on QEMU hostfwd behavior.
          JSONRPC_TUNNEL_PORT=59999
          VCOMPONENT_TUNNEL_PORT=58081
          ssh "${ssh_key_arg[@]}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ExitOnForwardFailure=yes -fN \
            -L "127.0.0.1:${JSONRPC_TUNNEL_PORT}:127.0.0.1:9998" \
            -L "127.0.0.1:${VCOMPONENT_TUNNEL_PORT}:127.0.0.1:8080" \
            -p "$selected_ssh_port" "$selected_ssh_user@127.0.0.1"

          # Ensure tunnel process is cleaned up even if tests fail.
          tunnel_pid="$(pgrep -f "127.0.0.1:${JSONRPC_TUNNEL_PORT}:127.0.0.1:9998" | head -n 1 || true)"
          cleanup_tunnel() {
            if [[ -n "${tunnel_pid:-}" ]]; then
              kill "$tunnel_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_tunnel EXIT

          nc -z -w3 127.0.0.1 "$JSONRPC_TUNNEL_PORT"
          nc -z -w3 127.0.0.1 "$VCOMPONENT_TUNNEL_PORT"

          export TARGET_HOST=127.0.0.1
          export JSONRPC_PORT="$JSONRPC_TUNNEL_PORT"
          export VCOMPONENT_PORT="$VCOMPONENT_TUNNEL_PORT"
          export WPEFRAMEWORK_JSONRPC_URL="http://127.0.0.1:${JSONRPC_TUNNEL_PORT}/jsonrpc"
          echo "Final WPEFramework endpoint: $WPEFRAMEWORK_JSONRPC_URL"
          export HDMICEC_AUTO_COVERAGE=0
          python3 SuitManager.py | tee "$QEMU_WORKDIR/vdevice-tests.log"

      - name: Collect plugin coverage from guest
        if: always()
        env:
          QEMU_SSH_PRIVATE_KEY: ${{ secrets.QEMU_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -f "$QEMU_WORKDIR/ssh-target.env" ]]; then
            # shellcheck disable=SC1090
            source "$QEMU_WORKDIR/ssh-target.env"
          fi

          selected_ssh_port="${QEMU_SSH_PORT:-$SSH_HOST_PORT}"
          selected_ssh_user="${QEMU_SSH_USER:-root}"

          ssh_key_arg=()
          if [[ -n "${QEMU_SSH_PRIVATE_KEY:-}" ]]; then
            ssh_key_arg=(-i ~/.ssh/qemu_id_rsa)
          fi

          mkdir -p "$QEMU_WORKDIR/coverage"

          # Generate coverage inside guest where gcda/gcno data exists.
          scp "${ssh_key_arg[@]}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P "$selected_ssh_port" \
            "$GITHUB_WORKSPACE/Tests/vDeviceTests/hdmicecsource-gcov-report.sh" \
            "$selected_ssh_user@127.0.0.1:/tmp/hdmicecsource-gcov-report.sh"

          ssh "${ssh_key_arg[@]}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$selected_ssh_port" "$selected_ssh_user@127.0.0.1" '
            set -e
            systemctl restart WPEFramework || systemctl restart wpeframework || true
            sleep 3
            chmod +x /tmp/hdmicecsource-gcov-report.sh
            /tmp/hdmicecsource-gcov-report.sh /tmp/hdmicecsource-coverage
            ls -lh /tmp/hdmicecsource-coverage/
          '

          # Pull plugin-only outputs to host workspace artifacts.
          scp "${ssh_key_arg[@]}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P "$selected_ssh_port" \
            "$selected_ssh_user@127.0.0.1:/tmp/hdmicecsource-coverage/plugin.info" \
            "$QEMU_WORKDIR/coverage/plugin.info"

          # Optional files when available.
          scp "${ssh_key_arg[@]}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P "$selected_ssh_port" \
            "$selected_ssh_user@127.0.0.1:/tmp/hdmicecsource-coverage/coverage.xml" \
            "$QEMU_WORKDIR/coverage/coverage.xml" || true

          if command -v lcov >/dev/null 2>&1; then
            lcov --summary "$QEMU_WORKDIR/coverage/plugin.info" > "$QEMU_WORKDIR/coverage/plugin-summary.txt" || true
          fi

      - name: Upload plugin coverage to Artifactory
        if: always()
        env:
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
          ARTIFACTORY_COVERAGE_BASE_URL: ${{ secrets.ARTIFACTORY_COVERAGE_BASE_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${ARTIFACTORY_USER:-}" || -z "${ARTIFACTORY_TOKEN:-}" || -z "${ARTIFACTORY_COVERAGE_BASE_URL:-}" ]]; then
            echo "Missing Artifactory coverage upload configuration. Required secrets: ARTIFACTORY_USER, ARTIFACTORY_TOKEN, ARTIFACTORY_COVERAGE_BASE_URL" >&2
            exit 1
          fi

          cov_dir="$QEMU_WORKDIR/coverage"
          if [[ ! -f "$cov_dir/plugin.info" ]]; then
            echo "Coverage file missing: $cov_dir/plugin.info" >&2
            exit 1
          fi

          target_base="${ARTIFACTORY_COVERAGE_BASE_URL%/}/entservices-hdmicecsource/${GITHUB_REF_NAME}/${GITHUB_RUN_ID}"
          echo "Uploading plugin coverage to: $target_base"

          curl -sS -fL -u "$ARTIFACTORY_USER:$ARTIFACTORY_TOKEN" -T "$cov_dir/plugin.info" "$target_base/plugin.info"

          if [[ -f "$cov_dir/plugin-summary.txt" ]]; then
            curl -sS -fL -u "$ARTIFACTORY_USER:$ARTIFACTORY_TOKEN" -T "$cov_dir/plugin-summary.txt" "$target_base/plugin-summary.txt"
          fi

          if [[ -f "$cov_dir/coverage.xml" ]]; then
            curl -sS -fL -u "$ARTIFACTORY_USER:$ARTIFACTORY_TOKEN" -T "$cov_dir/coverage.xml" "$target_base/coverage.xml"
          fi

      - name: Collect guest WPEFramework diagnostics
        if: always()
        env:
          QEMU_SSH_PRIVATE_KEY: ${{ secrets.QEMU_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -f "$QEMU_WORKDIR/ssh-target.env" ]]; then
            # shellcheck disable=SC1090
            source "$QEMU_WORKDIR/ssh-target.env"
          fi

          selected_ssh_port="${QEMU_SSH_PORT:-$SSH_HOST_PORT}"
          selected_ssh_user="${QEMU_SSH_USER:-root}"

          ssh_key_arg=()
          if [[ -n "${QEMU_SSH_PRIVATE_KEY:-}" ]]; then
            ssh_key_arg=(-i ~/.ssh/qemu_id_rsa)
          fi

          ssh "${ssh_key_arg[@]}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$selected_ssh_port" "$selected_ssh_user@127.0.0.1" '
            echo "===== ps ====="
            ps w | grep -Ei "wpeframework|thunder|hdmicec" | grep -v grep || true
            echo "===== listening ports ====="
            if command -v ss >/dev/null 2>&1; then
              ss -ltnp || true
            elif command -v netstat >/dev/null 2>&1; then
              netstat -ltnp || true
            fi
            echo "===== journalctl WPEFramework ====="
            journalctl -u WPEFramework -u wpeframework -n 200 --no-pager 2>/dev/null || true
            echo "===== systemctl status ====="
            systemctl status WPEFramework wpeframework 2>/dev/null || true
            echo "===== log files ====="
            find /opt/logs /var/log -maxdepth 2 -type f \( -iname "*wpe*" -o -iname "*thunder*" -o -iname "*hdmi*" \) 2>/dev/null | while read logfile; do
              echo "--- $logfile ---"
              tail -n 120 "$logfile" 2>/dev/null || true
            done
          ' > "$QEMU_WORKDIR/guest-wpeframework-diagnostics.log" 2>&1 || true

      - name: Upload logs and plugin artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-build-and-logs
          path: |
            artifacts/plugins/**
            /tmp/qemu-artifacts/coverage/**
            /tmp/qemu-artifacts/plugin-*.txt
            /tmp/qemu-artifacts/*.log
            /tmp/qemu-artifacts/*.pid
            /tmp/qemu-artifacts/serial.log
