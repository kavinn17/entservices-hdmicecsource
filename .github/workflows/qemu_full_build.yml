name: Build Component in Native Environment

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main, qemu, 'sprint/**', 'release/**', develop, 'test/**' ]
  pull_request:
    branches: [ main, qemu, 'sprint/**', 'release/**', topic/RDK*, develop, 'test/**' ]

jobs:
  build-and-deploy-to-qemu:
    name: Build entservices-hdmicecsource and deploy into QEMU
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rdkcentral/docker-rdk-ci:latest
    defaults:
      run:
        shell: bash
    env:
      QEMU_WORKDIR: /tmp/qemu-artifacts
      SSH_HOST_PORT: '5522'
      SSH_HOST_PORT_ALT: '5523'
      QEMU_SSH_USER: root
      QEMU_GUEST_LIB_DIR: /usr/lib/wpeframework/plugins
      QEMU_IMAGE_DIR: Tests/vDeviceTests/qemu-images
      QEMU_KERNEL_FILE: bzImage.bin
      QEMU_ROOTFS_FILE: rootfs.ext4
      QEMU_RUN_SCRIPT_FILE: run_qemu.sh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build dependencies
        run: |
          sh -x build_dependencies.sh

      - name: Build entservices-hdmicecsource
        run: |
          sh -x cov_build.sh

      - name: Collect plugin artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts/plugins
          find "$PWD/install" -type f -name '*.so' | grep '/plugins/' | tee artifacts/plugins/so-list.txt
          while IFS= read -r sofile; do
            cp -v "$sofile" artifacts/plugins/
          done < artifacts/plugins/so-list.txt
          test -n "$(ls -A artifacts/plugins/*.so 2>/dev/null || true)" || {
            echo "No plugin .so files found under install path" >&2
            exit 1
          }

      - name: Install QEMU and SSH tools
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            openssh-client \
            curl \
            ca-certificates \
            netcat-openbsd

      - name: Prepare kernel, rootfs and run script from repository (LFS)
        run: |
          set -euo pipefail
          mkdir -p "$QEMU_WORKDIR"
          image_dir="$GITHUB_WORKSPACE/$QEMU_IMAGE_DIR"

          kernel_src="$image_dir/$QEMU_KERNEL_FILE"
          rootfs_src="$image_dir/$QEMU_ROOTFS_FILE"
          run_script_src="$image_dir/$QEMU_RUN_SCRIPT_FILE"

          [[ -f "$kernel_src" ]] || { echo "Missing kernel image: $kernel_src" >&2; exit 1; }
          [[ -f "$rootfs_src" ]] || { echo "Missing rootfs image: $rootfs_src" >&2; exit 1; }

          cp -f "$kernel_src" "$QEMU_WORKDIR/kernel.bin"
          cp -f "$rootfs_src" "$QEMU_WORKDIR/rootfs.ext4"

          if [[ -f "$run_script_src" ]]; then
            cp -f "$run_script_src" "$QEMU_WORKDIR/run_qemu.sh"
            chmod +x "$QEMU_WORKDIR/run_qemu.sh"
          fi

          ls -lh "$QEMU_WORKDIR/"

      - name: Boot QEMU inside CI container
        run: |
          set -euo pipefail

          # Use KVM if available for fast boot; fall back to TCG (slow ~5-10 min)
          if [[ -r /dev/kvm ]]; then
            accel_args="-machine q35,accel=kvm -enable-kvm -cpu host"
            echo "KVM available, using hardware acceleration"
          else
            accel_args="-machine q35,accel=tcg -cpu max"
            echo "KVM not available, using software emulation (boot may take 5-10 minutes)"
          fi

          qemu-system-x86_64 \
            $accel_args \
            -kernel "$QEMU_WORKDIR/kernel.bin" \
            -append "console=ttyS0 root=/dev/vda rw rootwait init=/sbin/init" \
            -drive file="$QEMU_WORKDIR/rootfs.ext4",if=virtio,format=raw \
            -smp 4 \
            -m 2048 \
            -display none \
            -serial file:"$QEMU_WORKDIR/serial.log" \
            -netdev user,id=network0,hostfwd=tcp:127.0.0.1:${SSH_HOST_PORT}-:22 \
            -device virtio-net-pci,netdev=network0 \
            -daemonize \
            -pidfile "$QEMU_WORKDIR/qemu.pid"

          echo "QEMU started with PID: $(cat $QEMU_WORKDIR/qemu.pid)"

      - name: Wait for SSH in guest
        env:
          QEMU_SSH_PRIVATE_KEY: ${{ secrets.QEMU_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          ssh_key_arg=()
          if [[ -n "${QEMU_SSH_PRIVATE_KEY:-}" ]]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$QEMU_SSH_PRIVATE_KEY" > ~/.ssh/qemu_id_rsa
            chmod 600 ~/.ssh/qemu_id_rsa
            ssh_key_arg=(-i ~/.ssh/qemu_id_rsa)
          fi

          user_candidates=("$QEMU_SSH_USER" "root" "rdk")

          # Allow up to 20 min (240 x 5s); TCG emulation needs ~10 min to boot
          for attempt in $(seq 1 240); do
            # Abort early if QEMU process died
            if [[ -f "$QEMU_WORKDIR/qemu.pid" ]] && ! kill -0 "$(cat "$QEMU_WORKDIR/qemu.pid")" 2>/dev/null; then
              echo "QEMU process exited before SSH became ready" >&2
              break
            fi

            # Print serial log progress every 30 attempts (~2.5 min)
            if (( attempt % 30 == 0 )); then
              echo "--- boot progress at attempt $attempt ---"
              tail -n 20 "$QEMU_WORKDIR/serial.log" 2>/dev/null || true
            fi

            if nc -z -w2 127.0.0.1 "$SSH_HOST_PORT" 2>/dev/null; then
              for ssh_user in "${user_candidates[@]}"; do
                if ssh "${ssh_key_arg[@]}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -p "$SSH_HOST_PORT" "$ssh_user@127.0.0.1" 'echo SSH_READY' 2>/dev/null; then
                  echo "QEMU_SSH_PORT=$SSH_HOST_PORT" > "$QEMU_WORKDIR/ssh-target.env"
                  echo "QEMU_SSH_USER=$ssh_user" >> "$QEMU_WORKDIR/ssh-target.env"
                  exit 0
                fi
              done
            fi
            sleep 5
          done

          echo "QEMU guest SSH did not become ready in time" >&2
          echo "----- last 100 lines of serial.log -----" >&2
          tail -n 100 "$QEMU_WORKDIR/serial.log" >&2 || true
          exit 1

      - name: Copy new plugin .so into QEMU
        env:
          QEMU_SSH_PRIVATE_KEY: ${{ secrets.QEMU_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -f "$QEMU_WORKDIR/ssh-target.env" ]]; then
            # shellcheck disable=SC1090
            source "$QEMU_WORKDIR/ssh-target.env"
          fi

          selected_ssh_port="${QEMU_SSH_PORT:-$SSH_HOST_PORT}"
          selected_ssh_user="${QEMU_SSH_USER:-root}"

          ssh_key_arg=()
          if [[ -n "${QEMU_SSH_PRIVATE_KEY:-}" ]]; then
            ssh_key_arg=(-i ~/.ssh/qemu_id_rsa)
          fi

          for sofile in artifacts/plugins/*.so; do
            scp "${ssh_key_arg[@]}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P "$selected_ssh_port" "$sofile" "$selected_ssh_user@127.0.0.1:$QEMU_GUEST_LIB_DIR/"
          done

          ssh "${ssh_key_arg[@]}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$selected_ssh_port" "$selected_ssh_user@127.0.0.1" "sync; systemctl restart WPEFramework || true"

      - name: Upload logs and plugin artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-build-and-logs
          path: |
            artifacts/plugins/**
            /tmp/qemu-artifacts/*.log
            /tmp/qemu-artifacts/*.pid
            /tmp/qemu-artifacts/serial.log