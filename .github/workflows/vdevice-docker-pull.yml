name: vdevice-qemu-setup

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label.
        required: false
        type: string
        default: ubuntu-22.04

  workflow_dispatch:
    inputs:
      runner:
        description: Runner label.
        required: false
        type: string
        default: ubuntu-22.04

permissions:
  contents: read

jobs:
  setup-vdevice-qemu:
    name: Setup QEMU for vdevice
    runs-on: ${{ inputs.runner || 'ubuntu-22.04' }}
    steps:
      - name: Install QEMU system emulation
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system

      - name: Install QEMU user-static (Linux binary emulation)
        shell: bash
        run: |
          sudo apt-get install -y qemu-user-static

      - name: Verify QEMU installation
        shell: bash
        run: |
          qemu-system-x86_64 --version
          qemu-x86_64-static --version
